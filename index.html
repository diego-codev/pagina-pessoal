<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diego Alves de Oliveira | Página Pessoal</title>
  <meta name="description" content="Página pessoal de Diego Alves de Oliveira, atividade prática de GAC116 - Programação Web (UFLA).">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1c1c1e;
      --text-muted: #55555a;
      --accent: #3454d1;
      --border: #e0e0e5;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16161a;
        --card-bg: #222226;
        --text: #f2f2f2;
        --text-muted: #b5b5ba;
        --accent: #7c9bff;
        --border: #333338;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 2rem 1rem;
    }

    main {
      max-width: 700px;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      margin-bottom: 0.5rem;
    }

    p.lead {
      color: var(--text-muted);
      margin-bottom: 2.5rem;
    }

    .cards {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.25rem;
    }

    @media (min-width: 560px) {
      .cards {
        grid-template-columns: 1fr 1fr;
      }
    }

    .card-link {
      display: block;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 2rem 1.5rem;
      text-decoration: none;
      color: var(--text);
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .card-link:hover,
    .card-link:focus-visible {
      transform: translateY(-4px);
      border-color: var(--accent);
    }

    .card-link .framework {
      display: block;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 0.4rem;
    }

    .card-link .desc {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    footer {
      margin-top: 2.5rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>Diego Alves de Oliveira</h1>
    <p class="lead">Página pessoal desenvolvida como Atividade Prática 2 da disciplina GAC116 &ndash; Programação Web (UFLA), em duas versões com frameworks CSS diferentes.</p>

    <div class="cards">
      <a class="card-link" href="./bootstrap/">
        <span class="framework">Bootstrap</span>
        <span class="desc">Versão construída com Bootstrap 5.3</span>
      </a>
      <a class="card-link" href="./bulma/">
        <span class="framework">Bulma</span>
        <span class="desc">Versão construída com Bulma 1.x</span>
      </a>
    </div>

    <footer>
      <p>GAC116 &ndash; Programação Web &middot; UFLA</p>
    </footer>
  </main>
</body>
</html>
